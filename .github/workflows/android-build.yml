name: Android CI Build

# Runs on every push/PR to main, and can be triggered manually.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      # Release build is signed with the debug keystore by default (see
      # app/build.gradle.kts) so the APK is directly installable. To sign with a
      # real release key instead, add RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD /
      # RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD as repo secrets and export them
      # as env vars in this step.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
